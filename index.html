function inventoryDate(){return new Date(inventorySnapshot.updatedAt).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}
function stockPage(){const rows=inventoryRows(),sum=key=>rows.reduce((s,r)=>s+r[key],0),warehouses=inventoryWarehouses().filter(w=>inventoryWarehouse==='all'||w.key===inventoryWarehouse);return `${titleBlock('Склад','Остатки товаров по складам Wildberries и Ozon.',`<button class="secondary" data-action="export-stock">${I('download')} Экспорт остатков</button><button class="primary" data-action="stock-sync" ${inventoryLoading?'disabled':''}>${I('refresh')} ${inventoryLoading?'Обновление…':'Обновить остатки'}</button>`)}<div class="page-banner">${I('info')}<span>${inventorySnapshot.mode==='demo'?'Демонстрационные остатки и примеры названий складов. Кабинеты WB и Ozon ещё не подключены.':'Снимок остатков из настроенного источника сервера.'} Обновлено: ${inventoryDate()} МСК. ${inventorySnapshot.mode==='demo'?'Реальные названия и ID будут поступать из каталогов маркетплейсов.':''}</span></div>${metricStrip([['Доступно к продаже',num(sum('available'))+' шт.','по выбранным складам и товарам'],['В резерве',num(sum('reserved'))+' шт.','учитывается отдельно от доступного остатка'],['В пути к покупателям',num(sum('toCustomer'))+' шт.',num(sum('returnsInTransit'))+' шт. возвратов в пути']])}<div class="tabs" role="group" aria-label="Маркетплейс остатков">${[['all','Все склады'],['wb','Wildberries'],['ozon','Ozon']].map(([id,title])=>`<button data-stock-market="${id}" class="${inventoryMarket===id?'active':''}" aria-pressed="${inventoryMarket===id}">${title}</button>`).join('')}</div><form class="toolbar inventory-filters" id="inventoryFilters"><div><label for="warehouseFilter" class="visually-hidden">Склад маркетплейса</label><select id="warehouseFilter"><option value="all">Все склады</option>${inventoryWarehouses().map(w=>`<option value="${esc(w.key)}" ${inventoryWarehouse===w.key?'selected':''}>${marketName(w.marketplace)} · ${esc(w.name)} · ${w.fulfillment}</option>`).join('')}</select></div><div class="inventory-search"><label for="inventorySearch" class="visually-hidden">Название товара или артикул</label><input id="inventorySearch" name="query" type="search" value="${esc(inventoryQuery)}" placeholder="Название товара или артикул" maxlength="160"></div><button class="secondary" type="submit">${I('search')} Найти</button>${inventoryQuery?'<button type="button" class="text-btn" data-action="stock-clear-search">Сбросить поиск</button>':''}</form><div class="warehouse-grid">${warehouses.map(w=>{const items=rows.filter(r=>r.warehouseKey===w.key);return `<section class="panel warehouse-card"><div class="between"><span class="source-logo ${w.marketplace==='wb'?'wb':'ozon'}">${w.marketplace==='wb'?'WB':'ozon'}</span><span class="badge demo">${w.fulfillment}</span></div><h2>${esc(w.name)}</h2><div class="warehouse-qty">${num(items.reduce((s,r)=>s+r.available,0))} <span>шт.</span></div><p class="muted small">${new Set(items.map(r=>r.article)).size} артикулов · ${marketName(w.marketplace)}</p><p class="warehouse-id">${w.externalId?'ID источника: '+esc(w.externalId):'ID источника появится после подключения'}</p></section>`}).join('')}</div>${table(['Товар / артикул','Маркетплейс','Склад','Доступно, шт.','Резерв, шт.','К покупателю, шт.','Возвраты в пути, шт.'],rows.map(r=>{const w=inventorySnapshot.warehouses.find(w=>w.key===r.warehouseKey);return[`<strong>${esc(r.name)}</strong><small>${esc(r.article)}</small>`,marketName(r.marketplace),`<strong>${esc(w.name)}</strong><small>${w.fulfillment}${w.externalId?' · ID '+esc(w.externalId):' · демо'}</small>`,num(r.available),num(r.reserved),num(r.toCustomer),num(r.returnsInTransit)]}),'Остатки товаров по складам WB и Ozon')}<section class="panel stock-connection"><div class="panel-heading"><h2>Подключение остатков</h2></div><div class="panel-body"><p class="muted small">Склад определяется маркетплейсом, моделью работы и внешним ID. Числа для примера не являются остатками вашего кабинета. FBO/FBW маркетплейса и FBS продавца учитываются раздельно. Список складов строится из данных источника, а не зафиксированного списка названий.</p><div class="report-links"><button class="secondary" data-route="integrations">${I('plug')} Источники данных</button><button class="secondary" data-action="stock-contract">Формат подключения ${I('arrow')}</button></div></div></section>${pageFooter()}`}
async function refreshInventory(){if(inventoryLoading)return;if(!/^https?:$/.test(location.protocol)){toast('Для обновления откройте проект через npm start. Демо-остатки доступны и без сервера.');return}inventoryLoading=true;render();try{const response=await fetch('/api/inventory',{cache:'no-store',signal:AbortSignal.timeout(15000)});if(!response.ok)throw new Error('inventory-unavailable');const next=validateInventorySnapshot(await response.json());inventorySnapshot=next;if(inventoryWarehouse!=='all'&&!next.warehouses.some(w=>w.key===inventoryWarehouse))inventoryWarehouse='all';toast(next.mode==='live'?'Снимок остатков получен из источника сервера':'Демо-снимок обновлён. Подключение кабинетов ещё не настроено.')}catch{toast('Не удалось получить остатки. Последний показанный снимок сохранён; проверьте источник на сервере.')}finally{inventoryLoading=false;if(route==='stock')render()}}
function inventoryConnection(){openDrawer('Подключение складских остатков',`<div class="drawer-content"><h2>Склады из кабинета</h2><p style="margin-top:16px">Для синхронизации потребуются серверные коннекторы и ключи только на чтение. В браузере ключи не запрашиваются.</p><h3>Wildberries</h3><p>Каталог FBW и остатки нужно связать по идентификатору склада; название сохраняется таким, каким его возвращает WB. Если отчёт содержит только warehouseName, ID сопоставляется со справочником на сервере. Склады продавца FBS не подменяют каталог FBW.</p><h3>Ozon</h3><p>Используются warehouse_id и название из остатков FBO. offer_id/SKU сопоставляются с артикулом продавца. Список складов FBS не подменяет фулфилмент-центры FBO.</p><h3>Подготовленный формат</h3><p>Сервер читает проверенный JSON-снимок из INVENTORY_SNAPSHOT_PATH и отдаёт только складские данные через /api/inventory. При подключении в режиме live у каждого склада обязателен реальный externalId. Артикулы и количества группируются по складу; размеры одного артикула агрегируются до передачи в эту таблицу.</p><div class="info-box report-note">Сейчас подключение к кабинетам не выполнено. Официальные страницы тарифов и складов недоступны из текущей сети; ссылки ниже предназначены для проверки актуального каталога и методов перед подключением.</div><div class="stack report-note"><a href="https://dev.wildberries.ru/openapi/analytics" target="_blank" rel="noopener noreferrer">Документация WB ${I('arrowUp')}</a><a href="https://docs.ozon.ru/api/seller/" target="_blank" rel="noopener noreferrer">Документация Ozon Seller ${I('arrowUp')}</a></div></div>`)}
function initTrafficData(){data.dailyTraffic=[];const dates=[...new Set(data.dailySales.map(r=>r.date))],months=new Map();for(const date of dates){const key=date.slice(0,7);if(!months.has(key))months.set(key,[]);months.get(key).push(date)}for(const [,days]of months){const total=days.reduce((s,d)=>s+dailyWeight(d),0);for(const source of data.traffic){let assignedVisits=0,assignedOrders=0;days.forEach((date,index)=>{const last=index===days.length-1,visits=last?source.visits-assignedVisits:Math.round(source.visits*dailyWeight(date)/total),orders=last?source.orders-assignedOrders:Math.round(source.orders*dailyWeight(date)/total);assignedVisits+=visits;assignedOrders+=orders;data.dailyTraffic.push({date,name:source.name,visits,orders})})}}}
function selectedTraffic(){return data.traffic.map(source=>{const rows=data.dailyTraffic.filter(r=>r.name===source.name&&inPeriod(r.date)),visits=rows.reduce((s,r)=>s+r.visits,0),orders=rows.reduce((s,r)=>s+r.orders,0);return{name:source.name,visits,orders,conversion:ratioPercent(orders,visits)}})}
function analyticsPage(){return `${titleBlock('Аналитика','Показатели товаров: выручка, продажи, ДРР и прибыль.',periodControl()+`<button class="secondary" data-action="export-analytics">${I('download')} Скачать отчёт</button>`)}${reportBanner()}${channelFilter()}${productsTable()}<p class="muted small report-note">* Выплата − себестоимость (${data.settings.costPercent}% выручки) − реклама. Постоянные расходы по артикулам не распределены. Товары — выборка, а не весь каталог.</p>${pageFooter()}`}
function adsPage(){const spend=selectedCampaigns().reduce((s,c)=>s+c.spend,0),revenue=selectedCampaigns().reduce((s,c)=>s+c.revenue,0),traffic=selectedTraffic(),visits=traffic.reduce((s,t)=>s+t.visits,0),orders=traffic.reduce((s,t)=>s+t.orders,0);return `${titleBlock('Реклама','Кампании маркетплейсов и внешний трафик.',periodControl()+`<button class="secondary" data-action="export-advertising">${I('download')} Скачать отчёт</button>`)}${reportBanner()}<div class="tabs" role="group" aria-label="Раздел рекламы">${[['campaigns','Рекламные кампании'],['traffic','Внешний трафик']].map(([id,title])=>`<button data-ads-tab="${id}" class="${adsTab===id?'active':''}" aria-pressed="${adsTab===id}">${title}</button>`).join('')}</div>${adsTab==='traffic'?`${metricStrip([['Визиты',num(visits),'по выбранному периоду'],['Заказы',num(orders),'из внешних источников'],['Конверсия',ratioPercent(orders,visits).toFixed(1)+'%','заказы / визиты']])}${table(['Источник','Визиты','Конверсия','Заказы'],traffic.map(t=>[esc(t.name),num(t.visits),t.conversion.toFixed(1)+'%',num(t.orders)]),'Внешний трафик по выбранному периоду')}<div class="info-box report-note">Демонстрационные источники: Яндекс Директ, Telegram и органический поиск. Источники аналитики не подключены; показатели сформированы из примера дневных данных.</div>`:`${metricStrip([['Расход на рекламу',money(spend),'демо · выбранный период'],['Общая ДРР',ratioPercent(spend,revenue).toFixed(1)+'%',`целевой порог ≤ ${data.settings.maxDrr}%`],['Кампаний выше порога',`<span class="yellow">${selectedCampaigns().filter(c=>ratioPercent(c.spend,c.revenue)>data.settings.maxDrr).length}</span>`,'проверьте ставки и запросы']])}${channelFilter()}${campaignsTable()}`}${pageFooter()}`}

const initialInventorySnapshot={"version":1,"mode":"demo","updatedAt":"2026-10-20T09:00:00+03:00","note":"Демонстрационные остатки. Названия — примеры, не полный проверенный справочник. При подключении заменяются названиями и идентификаторами складов из кабинетов.","warehouses":[{"key":"demo-wb-koledino","marketplace":"wb","externalId":null,"name":"Коледино","fulfillment":"FBW"},{"key":"demo-wb-elektrostal","marketplace":"wb","externalId":null,"name":"Электросталь","fulfillment":"FBW"},{"key":"demo-wb-kazan","marketplace":"wb","externalId":null,"name":"Казань","fulfillment":"FBW"},{"key":"demo-ozon-khorugvino","marketplace":"ozon","externalId":null,"name":"Хоругвино","fulfillment":"FBO"},{"key":"demo-ozon-sofyino","marketplace":"ozon","externalId":null,"name":"Софьино","fulfillment":"FBO"},{"key":"demo-ozon-pushkino","marketplace":"ozon","externalId":null,"name":"Пушкино","fulfillment":"FBO"}],"items":[{"warehouseKey":"demo-wb-koledino","marketplace":"wb","article":"HD-001","name":"Худи oversize","available":80,"reserved":5,"toCustomer":8,"returnsInTransit":2},{"warehouseKey":"demo-wb-elektrostal","marketplace":"wb","article":"HD-001","name":"Худи oversize","available":44,"reserved":2,"toCustomer":4,"returnsInTransit":1},{"warehouseKey":"demo-wb-koledino","marketplace":"wb","article":"TS-002","name":"Футболка basic","available":280,"reserved":12,"toCustomer":20,"returnsInTransit":3},{"warehouseKey":"demo-wb-elektrostal","marketplace":"wb","article":"TS-002","name":"Футболка basic","available":200,"reserved":8,"toCustomer":10,"returnsInTransit":2},{"warehouseKey":"demo-wb-koledino","marketplace":"wb","article":"BG-005","name":"Сумка everyday","available":200,"reserved":5,"toCustomer":6,"returnsInTransit":0},{"warehouseKey":"demo-wb-kazan","marketplace":"wb","article":"BG-005","name":"Сумка everyday","available":320,"reserved":7,"toCustomer":8,"returnsInTransit":1},{"warehouseKey":"demo-ozon-khorugvino","marketplace":"ozon","article":"PT-003","name":"Брюки straight","available":140,"reserved":4,"toCustomer":8,"returnsInTransit":1},{"warehouseKey":"demo-ozon-sofyino","marketplace":"ozon","article":"PT-003","name":"Брюки straight","available":200,"reserved":6,"toCustomer":10,"returnsInTransit":2},{"warehouseKey":"demo-ozon-khorugvino","marketplace":"ozon","article":"SW-004","name":"Свитшот minimal","available":38,"reserved":2,"toCustomer":4,"returnsInTransit":1},{"warehouseKey":"demo-ozon-sofyino","marketplace":"ozon","article":"SW-004","name":"Свитшот minimal","available":20,"reserved":1,"toCustomer":2,"returnsInTransit":0}]};
let inventorySnapshot=validateInventorySnapshot(initialInventorySnapshot),inventoryMarket="all",inventoryWarehouse="all",inventoryQuery="",inventoryLoading=false;
initTrafficData();

document.addEventListener('click',e=>{const b=e.target.closest('[data-stock-market]');if(b){inventoryMarket=b.dataset.stockMarket;inventoryWarehouse='all';render()}});
document.addEventListener('change',e=>{if(e.target.id==='warehouseFilter'){inventoryWarehouse=e.target.value;render()}});
document.addEventListener('submit',e=>{if(e.target.id==='inventoryFilters'){e.preventDefault();inventoryQuery=document.getElementById('inventorySearch').value.trim();render()}});

window.addEventListener('hashchange',()=>navigate(location.hash.slice(1)));
navigate(location.hash.slice(1)||'home',false);if(persistenceWarning)setTimeout(()=>toast(persistenceWarning),500);
