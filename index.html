function periodControl(){return `<div class="period-controls"><div class="date-select row">${I('calendar')}<label class="visually-hidden" for="periodSelect">Период отчёта</label><select id="periodSelect">${[['today','Сегодня'],['yesterday','Вчера'],['week','Последние 7 дней'],['month','Текущий месяц'],['custom','Свой период']].map(([key,label])=>`<option value="${key}" ${period===key?'selected':''}>${label}</option>`).join('')}</select></div><button class="secondary range-button" data-action="date-range" aria-label="Выбрать даты в календаре">${dateText(reportRange.from)}${reportRange.from===reportRange.to?'':' — '+dateText(reportRange.to)}</button></div>`}
function setReportPeriod(key){if(key==='custom'){dateRangeEditor();return}period=key;reportRange=presetRange(key);persistPeriod();render()}
function persistPeriod(){try{localStorage.setItem('brandos-period-v1',JSON.stringify({period,range:reportRange}))}catch{}}
function dateRangeEditor(){showEditor('Выбрать период',`<p class="muted small">Выберите даты включительно. Демо-история доступна с ${dateText(data.coverage.from,true)} по ${dateText(today,true)}.</p><div class="form-row">${field('Начало периода','from','date',reportRange.from,`required min="${data.coverage.from}" max="${today}"`)}${field('Конец периода','to','date',reportRange.to,`required min="${data.coverage.from}" max="${today}"`)}</div>`,v=>{reportRange={from:v.from,to:v.to};period='custom';persistPeriod();toast('Период применён ко всем отчётам')},'Применить период');document.getElementById('editor').addEventListener('close',()=>render(),{once:true});const from=document.getElementById('f-from'),to=document.getElementById('f-to');const sync=()=>{to.min=from.value||data.coverage.from;to.setCustomValidity(from.value&&to.value&&from.value>to.value?'Дата окончания должна быть не раньше начала.':'')};from.addEventListener('input',sync);to.addEventListener('input',sync);sync()}
function reportBanner(){return `<div class="page-banner">${I('info')}<span>Демо-данные · ${esc(periodLabel())}. Период общий для выручки, ОПиУ, ДДС и РНП. Остатки на складе и счетах — текущий снимок.</span></div>`}
function pnlRows(range=reportRange){const r=reportPnl(range);return[['Выручка',r.revenue],['Комиссии маркетплейсов',-r.commission],['Логистика маркетплейсов',-r.logistics],['Себестоимость проданных товаров',-r.cost],['Валовая прибыль',r.gross],['Реклама',-r.advertising],['Постоянные расходы',-r.fixed],['Прибыль до налога',r.profit]]}
function reportTable(headers,rows,caption){return table(headers,rows,caption)}
function pnlPage(){const r=reportPnl(),previous=previousRange(),prevRows=pnlRows(previous);return `${titleBlock('ОПиУ','Отчёт о прибылях и убытках. Доходы и расходы по начислению.',periodControl()+`<button class="secondary" data-action="export-pnl">${I('download')} Скачать ОПиУ</button>`)}${reportBanner()}${metricStrip([['Выручка',money(r.revenue),periodLabel()],['Прибыль до налога',`<span class="${r.profit>=0?'green':'red'}">${money(r.profit)}</span>`,'после рекламы и постоянных расходов'],['Рентабельность',r.margin.toFixed(1)+'%','прибыль до налога / выручка']])}${reportTable(['Статья','Выбранный период','Предыдущий период','Изменение'],pnlRows().map(([label,value],i)=>{const prev=prevRows[i][1];return[`<strong>${label}</strong>`,`<span class="${value<0?'muted':'green'}">${money(value)}</span>`,money(prev),money(value-prev)]}),'ОПиУ по выбранному периоду')}<div class="info-box report-note">Метод начисления: выручка и расходы относятся к дате продажи. Комиссии и логистика разделены внутри удержаний маркетплейсов; реклама учтена отдельно. Себестоимость — ${data.settings.costPercent}% выручки. Налоги не включены: налоговый режим и признание расходов требуют уточнения.</div>${pageFooter()}`}
function ddsMetrics(range=reportRange){const tx=data.transactions.filter(t=>inPeriod(t.date,range)),opening=data.cashOpening+data.transactions.filter(t=>t.date<range.from).reduce((s,t)=>s+t.amount,0),income=tx.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0),expense=-tx.filter(t=>t.amount<0).reduce((s,t)=>s+t.amount,0);return{tx,opening,income,expense,net:income-expense,closing:opening+income-expense}}
function ddsPage(){const d=ddsMetrics();const groups=[['Поступления от продаж',d.tx.filter(t=>t.amount>0).reduce((s,t)=>s+t.amount,0)],['Логистика',d.tx.filter(t=>t.purpose.includes('Доставка')).reduce((s,t)=>s+t.amount,0)],['Поставщики',d.tx.filter(t=>t.purpose.includes('пошив')).reduce((s,t)=>s+t.amount,0)]];return `${titleBlock('ДДС','Отчёт о движении денежных средств. Только фактические платежи.',periodControl()+`<button class="secondary" data-action="export-dds">${I('download')} Скачать ДДС</button>`)}${reportBanner()}${metricStrip([['Остаток на начало',money(d.opening),'до операций выбранного периода'],['Чистый денежный поток',`<span class="${d.net>=0?'green':'red'}">${money(d.net)}</span>`,'поступления минус выплаты'],['Остаток на конец',money(d.closing),'начальный остаток + денежный поток']])}<div class="two-col report-blocks"><section class="panel"><div class="panel-heading"><h2>Движение денег</h2></div><div class="panel-body"><div class="list-row"><span>Поступления</span><strong class="green">${money(d.income)}</strong></div><div class="list-row"><span>Выплаты</span><strong class="red">${money(d.expense)}</strong></div><div class="list-row"><span>Чистый поток</span><strong>${money(d.net)}</strong></div></div></section><section class="panel"><div class="panel-heading"><h2>По статьям</h2></div><div class="panel-body">${groups.map(([name,amount])=>`<div class="list-row"><span>${name}</span><strong>${money(amount)}</strong></div>`).join('')}</div></section></div>${table(['Дата','Контрагент','Статья','Сумма'],d.tx.map(t=>[dateText(t.date),t.party,t.purpose,`<span class="${t.amount>=0?'green':'red'}">${money(t.amount)}</span>`]),'ДДС: операции выбранного периода')}<div class="info-box report-note">Демо-выписка содержит операции за ${dateText(day(-2))} — ${dateText(today)}. Для остальных дат отражены только известный остаток и отсутствие операций в примере. Планируемые платежи и прогноз денег в ДДС не включаются. Баланс всегда проверяется: начало + поступления − выплаты = конец.</div>${pageFooter()}`}
function dailyPerformance(){return datesBetween(reportRange.from,reportRange.to).map(date=>{const r=reportPnl({from:date,to:date}),plan=data.settings.plan/monthLength(date);return{date,...r,plan,deviation:r.revenue-plan,completion:ratioPercent(r.revenue,plan),drr:ratioPercent(r.advertising,r.revenue)}})}
function rnpPage(){const rows=dailyPerformance(),revenue=rows.reduce((s,r)=>s+r.revenue,0),plan=rows.reduce((s,r)=>s+r.plan,0);return `${titleBlock('РНП','Ежедневный контроль: план, факт и показатели бизнеса.',periodControl()+`<button class="secondary" data-action="export-rnp">${I('download')} Скачать РНП</button>`)}${reportBanner()}${metricStrip([['План выручки',money(plan),'месячный план распределён по дням'],['Факт выручки',money(revenue),periodLabel()],['Выполнение плана',ratioPercent(revenue,plan).toFixed(1)+'%',money(revenue-plan)+' к плану']])}${table(['Дата','План','Выручка','Выполнение','Отклонение','Заказы','Средний чек','Реклама','ДРР','Прибыль до налога'],rows.map(r=>[dateText(r.date),money(r.plan),money(r.revenue),r.completion.toFixed(1)+'%',`<span class="${r.deviation>=0?'green':'red'}">${money(r.deviation)}</span>`,num(r.orders),r.orders?money(r.revenue/r.orders):'—',money(r.advertising),r.drr.toFixed(1)+'%',`<span class="${r.profit>=0?'green':'red'}">${money(r.profit)}</span>`]),'РНП: ежедневный план и факт')}<div class="info-box report-note">Рабочий состав РНП: продажи, реклама, прибыль и выполнение плана. Строки и метрики можно уточнить под ваш процесс. Выручка и прибыль совпадают с ОПиУ за тот же период.</div>${pageFooter()}`}



function stockDays(p){return Math.floor(p.stock/(p.sold/28))}
function buildDecisions(){const candidates=[];const low=data.products.filter(p=>stockDays(p)<14).sort((a,b)=>stockDays(a)-stockDays(b));for(const p of low)candidates.push({id:'stock-'+p.id,type:'Склад',urgency:'high',title:`Дозаказать ${p.name.toLowerCase()}`,situation:`${p.article}: на складе ${p.stock} шт., хватит на ${stockDays(p)} дней при текущих продажах. Новая партия защитит выручку.`,steps:[`Согласовать партию ${p.article} с производством`,'Забронировать слот на складе маркетплейса','Проконтролировать приёмку поставки'],effect:Math.round(p.revenue*.18/1000)*1000,metric:'Остаток ≥ 28 дней',confidence:91,due:day(2),owner:'Михаил'});for(const c of data.campaigns.filter(c=>c.spend/c.revenue*100>data.settings.maxDrr))candidates.push({id:'ads-'+c.id,type:'Реклама',urgency:'high',title:`Снизить ДРР: ${c.name}`,situation:`ДРР ${ratioPercent(c.spend,c.revenue).toFixed(1)}% при лимите ${data.settings.maxDrr}%. За неделю — ${c.weeklyDrr}%. Расход ${money(c.spend)}.`,steps:['Проверить запросы с высокой ценой заказа','Снизить ставки по неэффективным запросам','Сравнить ДРР и заказы через 3 дня'],effect:Math.round((c.spend-c.revenue*data.settings.maxDrr/100)/1000)*1000,metric:`ДРР ≤ ${data.settings.maxDrr}%`,confidence:88,due:day(1),owner:'Анна'});const gap=data.cash.findIndex(v=>v<0);if(gap>=0)candidates.push({id:'cash-gap',type:'Финансы',urgency:'medium',title:'Предотвратить кассовый разрыв',situation:`На ${dateText(day(gap))} прогнозируется отрицательный остаток ${money(Math.min(...data.cash))}. Перенесите часть платежей или ускорьте дебиторку.`,steps:['Согласовать перенос части платежа поставщику','Связаться с клиентами по дебиторке','Обновить платёжный календарь'],effect:0,metric:'Остаток на счетах > 0 ₽',confidence:82,due:day(3),owner:'Екатерина'});const invoice=data.documents.find(d=>d.status==='Ждёт подписи');if(invoice)candidates.push({id:'doc-'+invoice.id,type:'Документы',urgency:'medium',title:'Проверить и подписать УПД',situation:`${invoice.name}, сумма ${money(invoice.amount)}. Подпись нужна до ${dateText(invoice.due||day(2))}.`,steps:['Сверить позиции УПД с фактической поставкой','Подписать документ в ЭДО'],effect:0,metric:'Документ подписан в ЭДО',confidence:100,due:invoice.due||day(2),owner:'Екатерина',documentId:invoice.id});for(const c of candidates){const existing=data.decisions.find(d=>d.id===c.id);if(!existing)data.decisions.push({...c,status:'new',taskIds:[],reason:''});else if(existing.status==='new')Object.assign(existing,c)}for(const d of data.decisions){if(d.status==='deferred'&&d.snoozeUntil<=today)d.status='new';if(d.status==='active'&&d.taskIds.length&&d.taskIds.every(id=>data.tasks.find(t=>t.id===id)?.status===2))d.status='done';}}
initReportData();
buildDecisions();
function toast(text){const el=document.getElementById('toast');el.textContent=text;el.classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('visible'),4200)}
function navMarkup(){const first=routes.slice(0,7),second=routes.slice(7);const link=([id,title,icon])=>`<a href="#${id}" data-route="${id}" class="${route===id?'active':''}" ${route===id?'aria-current="page"':''}>${I(icon)}<span>${title}</span>${id==='decisions'?`<span class="nav-count">${data.decisions.filter(d=>d.status==='new').length}</span>`:id==='tasks'?`<span class="nav-count">${data.tasks.filter(t=>t.status!==2).length}</span>`:''}</a>`;return `<div class="brand"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span>Brand<b>OS</b></span></div><button class="workspace" data-action="settings"><span class="workspace-icon">B</span><div><strong style="font-size:11px;font-weight:500">${esc(data.user.company)}</strong><div class="tagline">Рабочее пространство</div></div><span>${I('down')}</span></button><nav class="nav"><div class="nav-label">Обзор бизнеса</div>${first.map(link).join('')}<div class="nav-separator"></div><div class="nav-label">Управление</div>${second.map(link).join('')}</nav><div class="sidebar-bottom"><button class="assistant-trigger" data-action="chat">${I('spark')} ИИ-ассистент <span class="shortcut">⌘ J</span></button><div class="profile"><span class="avatar">${esc(initials(data.user.name))}</span><div class="profile-text">${esc(data.user.name)}<small>Владелец бизнеса</small></div><button class="icon-btn" aria-label="Настройки профиля" data-action="settings">${I('settings')}</button></div></div>`}
function initials(s){return s.split(' ').slice(0,2).map(n=>n[0]).join('').toUpperCase()}
function titleBlock(title,subtitle,actions=''){return `<div class="page-heading"><div><h1>${title}</h1><p class="subtitle">${subtitle}</p></div><div class="heading-actions">${actions}</div></div>`}

function demoBanner(){return `<div class="page-banner">${I('info')}<span>Демонстрационные данные. Подключите источники в разделе «Интеграции», чтобы перейти к данным бизнеса.</span></div>`}
function sparkline(color,index){const values=[[25,23,27,16,19,14,18,5,11,4],[26,25,18,22,12,16,9,13,5,3],[22,27,17,20,16,19,9,12,6,8],[25,17,23,16,20,9,13,5,12,4]][index];return `<svg class="spark" viewBox="0 0 90 34" aria-hidden="true"><defs><linearGradient id="sp${index}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity=".16"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs><path d="M0 ${values[0]} ${values.map((v,i)=>`L${i*10} ${v}`).join(' ')} L90 34 L0 34Z" fill="url(#sp${index})"/><polyline points="${values.map((v,i)=>`${i*10},${v}`).join(' ')}" fill="none" stroke="${color}" stroke-width="1.7"/></svg>`}
function kpis(){const t=totals();return `<div class="kpis">${[{title:'Выручка',value:money(t.revenue),change:`${t.growth>=0?'+':''}${t.growth.toFixed(1).replace('.',',')}%`,icon:'bag',color:'#a190ff'},{title:'Прибыль до налога',value:money(t.profit),change:moneyChange(t.profit,t.previousProfit),icon:'chart',color:'#58d6a3'},{title:'Маржинальность',value:t.margin.toFixed(1).replace('.',',')+'%',change:(t.margin-t.previousMargin).toFixed(1)+' п.п.',icon:'target',color:'#6d9fff'},{title:'Деньги на счетах',value:money(t.balance),change:'Текущий остаток',icon:'wallet',color:'#f1bd6a'}].map((k,i)=>`<section class="panel kpi"><div class="kpi-top"><span>${k.title}</span>${I(k.icon)}</div><div class="kpi-value">${k.value}</div><div class="kpi-bottom"><span class="${k.change.startsWith('-')?'red':'green'}">${k.change.startsWith('-')?'↘':i===3?'':'↗'} ${k.change}</span><span class="muted">к прошлому периоду</span></div>${sparkline(k.color,i)}</section>`).join('')}</div>`}
function cashChart(){const values=[...data.history,...data.cash.slice(1)];const x=i=>50+i*(620/(values.length-1));const y=v=>28+(2200000-v)/2600000*186;const points=(arr,offset=0)=>arr.map((v,i)=>`${x(i+offset)},${y(v)}`).join(' ');const gap=data.cash.findIndex(v=>v<0);const gx=x(10+gap);return `<div class="chart-legend"><span class="legend-item"><i class="legend-line"></i>Факт</span><span class="legend-item"><i class="legend-line dashed"></i>Прогноз</span><span class="legend-item"><i class="legend-square"></i>Коридор прогноза</span><span style="margin-left:auto">тыс. ₽</span></div><div class="chart-wrap"><svg class="cash-chart" viewBox="0 0 700 248" role="img" aria-label="Факт и прогноз денег: через ${gap} дней возможен кассовый разрыв ${money(Math.min(...data.cash))}"><defs><linearGradient id="cashFill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8b7cf8" stop-opacity=".18"/><stop offset="1" stop-color="#8b7cf8" stop-opacity="0"/></linearGradient></defs>${[2000000,1500000,1000000,500000,0].map(v=>`<line x1="50" x2="670" y1="${y(v)}" y2="${y(v)}" stroke="${v===0?'#64404c':'#2b3040'}" stroke-dasharray="${v===0?'4 4':'2 5'}"/><text x="38" y="${y(v)+4}" text-anchor="end">${v/1000}</text>`).join('')}<path d="M${x(0)} ${y(0)} L${points(data.history).replace(/ /g,' L')} L${x(10)} ${y(0)} Z" fill="url(#cashFill)"/><polygon points="${points(data.cash.map((v,i)=>v+95000+i*4500),10)} ${points(data.cash.map((v,i)=>v-95000-i*4500).reverse().reverse(),10).split(' ').reverse().join(' ')}" fill="#8b7cf8" fill-opacity=".10"/><line x1="${x(10)}" x2="${x(10)}" y1="22" y2="218" stroke="#5f576e" stroke-dasharray="3 4"/><text x="${x(10)}" y="13" text-anchor="middle">Сегодня</text><polyline points="${points(data.history)}" fill="none" stroke="#9b88ff" stroke-width="2.5" stroke-linejoin="round"/><polyline points="${points(data.cash,10)}" fill="none" stroke="#ad9aff" stroke-width="2" stroke-dasharray="5 5" stroke-linejoin="round"/><circle cx="${x(10)}" cy="${y(data.cash[0])}" r="4" fill="#b5a4ff" stroke="#131721" stroke-width="2"/><line x1="${gx}" x2="${gx}" y1="${y(0)-16}" y2="${y(data.cash[gap])+12}" stroke="#ff879a" stroke-dasharray="3 3"/><circle cx="${gx}" cy="${y(data.cash[gap])}" r="4" fill="#ff879a" stroke="#131721" stroke-width="2"/>${[0,7,14,21,28,38].map(i=>`<text x="${x(i)}" y="238" text-anchor="middle">${dateText(day(i-10))}</text>`).join('')}${values.map((v,i)=>`<circle class="chart-point" data-chart-index="${i}" cx="${x(i)}" cy="${y(v)}" r="8" fill="transparent"><title>${dateText(day(i-10))}: ${money(v)} · ${i<=10?'факт':'прогноз'}</title></circle>`).join('')}</svg><div class="chart-tip" id="chartTip"></div></div><div class="chart-alert">${I('warning')}<span>Возможен кассовый разрыв ${dateText(day(gap))}: <strong>${money(Math.min(...data.cash))}</strong></span><button data-action="discuss-gap">Разобраться ${I('arrow')}</button></div>`}

on class="section-link" data-route="sales">Все продажи ${I('arrow')}</button></section><section class="panel mini-card"><div class="mini-card-top"><span>Склад и поставки</span>${I('box')}</div><div class="mini-value">${num(inventorySnapshot.items.reduce((s,r)=>s+r.available,0))} <span class="muted" style="font-size:12px;font-weight:400">шт.</span></div><p><span class="yellow">${data.products.filter(p=>stockDays(p)<14).length} артикула</span> заканчиваются</p><div class="list-row"><span class="muted">В пути на склады</span><span>${num(data.supplies.filter(s=>s.status==='В пути').reduce((n,s)=>n+s.units,0))} шт.</span></div><button class="section-link" data-route="supplies">Проверить поставки ${I('arrow')}</button></section><section class="panel mini-card"><div class="mini-card-top"><span>Маркетплейсы</span>${I('store')}</div><div class="mini-value">2 <span class="muted" style="font-size:12px;font-weight:400">канала продаж</span></div><p>Wildberries и Ozon · демо</p>${periodChannels().slice(0,2).map(c=>`<div class="list-row"><span class="muted">${c.name}</span><span>${money(c.revenue,true)}</span></div>`).join('')}<button class="section-link" data-route="marketplaces">Открыть показатели ${I('arrow')}</button></section><section class="panel mini-card"><div class="mini-card-top"><span>Внешний трафик</span>${I('globe')}</div><div class="mini-value">${num(data.traffic.reduce((s,t)=>s+t.visits,0))} <span class="muted" style="font-size:12px;font-weight:400">визитов</span></div><p>за текущий месяц · демо</p>${data.traffic.slice(0,2).map(t=>`<div class="list-row"><span class="muted">${t.name}</span><span>${num(t.visits)}</span></div>`).join('')}<button class="section-link" data-action="open-traffic">Аналитика трафика ${I('arrow')}</button></section></div></div><aside class="right-column" aria-label="Решения и уведомления"><section class="panel insights"><div class="panel-heading"><div class="title-with-icon">${I('spark')}<h2>Инсайты для бизнеса</h2></div><span class="ai-label">ПРАВИЛА</span></div>${insights.length?insights.map((d,i)=>`<button class="insight" data-decision="${d.id}"><div class="insight-meta ${i===0?'red':i===1?'yellow':'purple'}"><span class="priority-dot"></span>${i===0?'Высокий приоритет':i===1?'Стоит проверить':'Возможность роста'} · ${d.type}</div><div class="insight-title">${esc(d.title)}${I('arrowUp')}</div><p>${esc(d.situation)}</p>${d.effect?`<div class="insight-effect">Потенциал: +${money(d.effect)} / мес.</div>`:''}</button>`).join(''):'<div class="panel-body muted small">Все решения разобраны. Отличная работа.</div>'}<button class="insights-footer" data-route="decisions">Все решения <span>${data.decisions.filter(d=>d.status==='new').length}</span>${I('arrow')}</button></section><section class="panel"><div class="panel-heading"><h2 style="font-size:14px">Требуют внимания</h2><span class="badge warning">${data.tasks.filter(t=>t.status!==2&&t.due<=today).length}</span></div><div class="panel-body" style="padding-top:0"><div class="attention-item">${I('file','yellow')}<div><strong style="font-size:11px;font-weight:500">УПД ждёт подписи</strong><p>Текстиль Про · ${money(420000)}</p><button data-document="d1">Открыть документ ${I('arrow')}</button></div></div><div class="attention-item">${I('clock','red')}<div><strong style="font-size:11px;font-weight:500">Задачи на сегодня</strong><p>${data.tasks.filter(t=>t.status!==2&&t.due===today).length} задачи, которые важно завершить</p><button data-action="today-tasks">Перейти к задачам ${I('arrow')}</button></div></div></div></section><section class="panel"><div class="panel-heading"><h2 style="font-size:14px">Быстрые действия</h2></div><div class="panel-body" style="padding-top:4px"><div class="quick-actions"><button data-action="new-task">${I('plus')}Создать задачу</button><button data-action="upload">${I('upload')}Загрузить документ</button><button data-route="stock">${I('box')}Остатки по складам</button><button data-action="chat">${I('spark')}Спросить ассистента</button></div></div></section><section class="panel"><div class="panel-heading"><h2 style="font-size:14px">Последние документы</h2><button class="icon-btn" data-route="documents" aria-label="Все документы">${I('arrowUp')}</button></div><div class="panel-body" style="padding-top:0">${data.documents.slice(0,3).map((d,i)=>`<button class="document-mini" data-document="${esc(d.id)}"><span class="file-icon ${i===1?'blue-file':''}">${esc(d.extension)}</span><div><strong>${esc(d.name)}</strong><p>${esc(d.source)} · ${dateText(d.date)} ${d.amount?'· '+money(d.amount):''}</p></div></button>`).join('')}</div></section></aside></div>${pageFooter()}`}
function pageFooter(){return `<footer class="footer"><span>BrandOS <span class="muted">/</span> Ваш бизнес под контролем</span><span class="status-online"><span class="dot"></span>${storageAvailable?'Изменения сохраняются в этом браузере':'Сохранение в браузере недоступно'} · демо</span></footer>`}
function table(headers,rows,caption='Демонстрационные данные'){return `<div class="panel table-wrap" tabindex="0" role="region" aria-label="${esc(caption)}"><table class="data-table ${headers[0]==='Дата'?'date-first':''}"><caption class="visually-hidden">${caption}</caption><thead><tr>${headers.map(h=>`<th scope="col" class="${/Доступно|Резерв|К покупателю|Визиты|Конверсия|Сумма|Выручка|Расход|Прибыль|План|Доход|Цена|Себестоимость|Комиссия|Логистика|Реклама|Марж|Остаток|Заказы|Продано|Количество|ДРР|CTR|Выполн|Отклонение|Безубыт|Средний|Упаковка|Возврат|Изменение|период/.test(h)?'numeric':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${/Доступно|Резерв|К покупателю|Визиты|Конверсия|Сумма|Выручка|Расход|Прибыль|План|Доход|Цена|Себестоимость|Комиссия|Логистика|Реклама|Марж|Остаток|Заказы|Продано|Количество|ДРР|CTR|Выполн|Отклонение|Безубыт|Средний|Упаковка|Возврат|Изменение|период/.test(headers[i])?'numeric':''}">${c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${headers.length}"><div class="empty">Нет данных по выбранным фильтрам.</div></td></tr>`}</tbody></table></div>`}
function metricStrip(items){return `<div class="metric-strip">${items.map(([label,value,note])=>`<div class="panel"><p>${label}</p><strong>${value}</strong>${note?`<small class="muted">${note}</small>`:''}</div>`).join('')}</div>`}
function tasksPage(){const open=data.tasks.filter(t=>t.status!==2);const filtered=data.tasks.filter(t=>(taskFilter==='all'||taskFilter==='today'&&t.due===today||taskFilter==='overdue'&&t.due<today&&t.status!==2||taskFilter==='ai'&&t.ai)&&(ownerFilter==='all'||t.owner===ownerFilter));return `${titleBlock('Задачи','Из решений — в действия. Всё, что движет бизнес вперёд.',`<button class="secondary" data-action="export-tasks">${I('download')} Экспорт</button><button class="primary" data-action="new-task">${I('plus')} Создать задачу</button>`)}${metricStrip([['Открыто',open.length,'включая задачи в работе'],['На сегодня',open.filter(t=>t.due===today).length,dateText(today,true)],['Просрочено',`<span class="${open.some(t=>t.due<today)?'red':''}">${open.filter(t=>t.due<today).length}</span>`,'стоит проверить в первую очередь']])}<div class="toolbar"><label class="visually-hidden" for="taskFilter">Фильтр задач</label><select id="taskFilter">${[['all','Все задачи'],['today','На сегодня'],['overdue','Просроченные'],['ai','Созданы по правилам']].map(([v,n])=>`<option value="${v}" ${taskFilter===v?'selected':''}>${n}</option>`).join('')}</select><label class="visually-hidden" for="ownerFilter">Исполнитель</label><select id="ownerFilter"><option value="all">Все исполнители</option>${data.user.team.map(n=>`<option ${n===ownerFilter?'selected':''}>${esc(n)}</option>`).join('')}</select><span class="grow"></span><span class="muted small">Перетащите карточку или измените статус в ней</span></div><div class="kanban">${taskStages.map((s,index)=>`<section class="kanban-col" data-drop-kind="task" data-drop-stage="${index}"><h2 class="column-title"><span class="dot ${index===0?'purple':index===1?'blue':'green'}"></span>${s}<small>${filtered.filter(t=>t.status===index).length}</small></h2>${filtered.filter(t=>t.status===index).map(t=>`<article class="task-card" draggable="true" data-drag-kind="task" data-drag-id="${esc(t.id)}"><div class="between"><span class="badge ${t.priority==='high'?'danger':t.priority==='medium'?'warning':'demo'}">${{high:'Высокий',medium:'Средний',low:'Низкий'}[t.priority]}</span>${t.ai?'<span class="small purple" style="font-size:10px">✧ Создал ИИ · демо</span>':''}</div><button class="task-open" data-edit-task="${esc(t.id)}"><h3>${esc(t.title)}</h3></button><div class="row"><span class="${t.due<today&&t.status!==2?'red':''}">${I('calendar')} ${dateText(t.due)}</span><span class="row" style="gap:6px"><span class="avatar">${esc(initials(t.owner))}</span>${esc(t.owner)}</span></div>${t.documentId?`<button class="text-btn" data-document="${esc(t.documentId)}">${I('file')} Открыть документ</button>`:''}<label class="visually-hidden" for="status-${esc(t.id)}">Статус: ${esc(t.title)}</label><select id="status-${esc(t.id)}" data-task-status="${esc(t.id)}">${taskStages.map((n,i)=>`<option value="${i}" ${i===t.status?'selected':''}>${n}</option>`).join('')}</select></article>`).join('')}${!filtered.some(t=>t.status===index)?'<p class="muted small" style="padding:20px 4px">Задач пока нет</p>':''}</section>`).join('')}</div>${pageFooter()}`}

function documentsPage(){const docs=data.documents.filter(d=>(docSource==='all'||d.source===docSource)&&(docStatus==='all'||d.status===docStatus));return `${titleBlock('Документы','Счета, акты и отчёты — в одном порядке.',`<button class="secondary" data-action="export-documents">${I('download')} Экспорт списка</button><button class="primary" data-action="upload">${I('upload')} Загрузить документ</button>`)}${metricStrip([['Всего документов',data.documents.length,'в локальном рабочем пространстве'],['Новые',data.documents.filter(d=>d.status==='Новый').length,'требуют проверки'],['Ждут подписи',`<span class="yellow">${data.documents.filter(d=>d.status==='Ждёт подписи').length}</span>`,'подписание выполняется в ЭДО']])}<div class="toolbar"><label class="visually-hidden" for="docSource">Источник документов</label><select id="docSource">${['all','Почта','ЭДО','WB','Ozon','Банк','Telegram','Загрузка'].map(s=>`<option value="${s}" ${docSource===s?'selected':''}>${s==='all'?'Все источники':s}</option>`).join('')}</select><label class="visually-hidden" for="docStatus">Статус документов</label><select id="docStatus">${['all','Новый','Обработан','Ждёт подписи'].map(s=>`<option value="${s}" ${docStatus===s?'selected':''}>${s==='all'?'Все статусы':s}</option>`).join('')}</select><span class="grow"></span><span class="small muted">PDF, изображения, таблицы · до 10 МБ</span></div>${table(['Документ','Источник','Сумма','Дата','Статус','Действие'],docs.map(d=>[`<div class="row"><span class="file-icon ${d.extension==='XLSX'?'blue-file':''}">${esc(d.extension)}</span><div><strong>${esc(d.name)}</strong><small>${esc(d.party||'Загружен вручную')}</small></div></div>`,esc(d.source),d.amount?money(d.amount):'—',dateText(d.date),`<span class="badge ${d.status==='Ждёт подписи'?'warning':d.status==='Обработан'?'success':'demo'}">${esc(d.status)}</span>`,`<button data-document="${esc(d.id)}">Открыть ${I('chevron')}</button>`]),'Документы: демо-примеры и локальные загрузки')}<p class="muted small" style="margin-top:16px">Файлы хранятся в этом браузере. Распознавание ИИ и получение из внешних источников пока не подключены.</p>${pageFooter()}`}
function decisionsPage(){const list=data.decisions.filter(d=>d.status===decisionTab);return `${titleBlock('Центр решений','Не просто цифры. Понятные действия для роста бизнеса.',`<button class="secondary" data-action="recalculate">${I('refresh')} Пересчитать сейчас</button>`)}<div class="page-banner">${I('spark')}<span>Решения сформированы встроенными правилами на демо-данных. Эффект в рублях — оценка, а не гарантия.</span></div>${metricStrip([['Требуют решения',data.decisions.filter(d=>d.status==='new').length,'по данным склада, рекламы и финансов'],['Потенциальный эффект',money(data.decisions.filter(d=>d.status==='new').reduce((s,d)=>s+d.effect,0),true),'оценка в месяц'],['В работе',data.decisions.filter(d=>d.status==='active').length,'прогресс рассчитывается по задачам']])}<div class="tabs" role="group" aria-label="Статус решений">${[['new','Новые'],['active','В работе'],['deferred','Отложены'],['done','Выполнены'],['rejected','Отклонены']].map(([v,n])=>`<button data-decision-tab="${v}" class="${decisionTab===v?'active':''}" aria-pressed="${decisionTab===v}">${n} <span class="muted">${data.decisions.filter(d=>d.status===v).length}</span></button>`).join('')}</div>${list.length?`<div class="decision-list">${list.map(d=>{const done=d.taskIds.filter(id=>data.tasks.find(t=>t.id===id)?.status===2).length;return `<article class="panel decision-card"><div class="between"><span class="badge ${d.urgency==='high'?'danger':'warning'}">${d.urgency==='high'?'Высокий приоритет':'Стоит проверить'}</span><span class="muted small">${esc(d.type)}</span></div><h2>${esc(d.title)}</h2><p>${esc(d.situation)}</p><ol>${d.steps.map(s=>`<li>${esc(s)}</li>`).join('')}</ol><div class="muted small">Срок: ${dateText(d.due)} · Уверенность правила: ${d.confidence}%<br>Проверка: ${esc(d.metric)}</div>${d.status==='active'||d.status==='done'?`<div class="stack" style="gap:8px"><span class="muted small">Выполнено ${done} из ${d.taskIds.length} задач</span><div class="track"><span style="width:${d.taskIds.length?done/d.taskIds.length*100:0}%"></span></div></div>`:''}${d.status==='deferred'?`<p>Вернёмся к решению ${dateText(d.snoozeUntil)}.</p>`:''}${d.status==='rejected'?`<p>Причина: ${esc(d.reason)}</p>`:''}<div class="effect"><span class="muted">Оценка эффекта / мес.</span><strong class="green">${d.effect?'+'+money(d.effect):'Снижение риска'}</strong></div><div class="decision-actions">${d.status==='new'?`<button class="primary" data-accept="${d.id}">${I('check')} Принять</button><button class="secondary" data-snooze="${d.id}" aria-label="Отложить ${esc(d.title)} на 3 дня">На 3 дня</button><button class="text-btn" data-reject="${d.id}">Отклонить</button>`:d.status==='active'?'<button class="secondary" data-route="tasks">Открыть задачи</button>':d.status==='deferred'||d.status==='rejected'?`<button class="secondary" data-restore="${d.id}">Вернуть в новые</button>`:''}<button class="text-btn" data-discuss="${d.id}">${I('spark')} Обсудить</button></div></article>`}).join('')}</div>`:`<div class="panel empty"><h2>Здесь пока нет решений</h2><p>Новые рекомендации появятся после пересчёта. Принятые решения можно найти во вкладке «В работе».</p><button class="secondary" data-action="recalculate">Пересчитать решения</button></div>`}${pageFooter()}`}

function campaignsTable(){return table(['Кампания','Канал','Расход','Заказы','ДРР / неделя','CTR','Цена заказа'],selectedCampaigns().map(c=>[`<strong>${c.name}</strong><small><span class="green">●</span> ${c.status} · демо</small>`,c.channel,money(c.spend),num(c.orders),`<span class="${c.spend/c.revenue*100>data.settings.maxDrr?'yellow':'green'}">${ratioPercent(c.spend,c.revenue).toFixed(1)}% / ${c.weeklyDrr}%</span>`,ratioPercent(c.clicks,c.views).toFixed(1)+'%',c.orders?money(c.spend/c.orders):'—']),'Рекламные кампании, демо')}

function financePage(){const t=totals();return `${titleBlock('Финансы','Деньги, обязательства и запас прочности.',`<button class="secondary" data-action="export-finance">${I('download')} Скачать выписку</button>`)}${periodControl()}<div class="report-links"><button class="secondary" data-route="pnl">ОПиУ ${I('arrow')}</button><button class="secondary" data-route="dds">ДДС ${I('arrow')}</button></div>${reportBanner()}${metricStrip([['Деньги на счетах',money(t.balance),'2 демо-счёта'],['К выплате от маркетплейсов',money(643400),'демо · ближайшая неделя'],['Предстоящие платежи',money(data.payments.reduce((s,p)=>s+p.amount,0)),'по платёжному календарю']])}<div class="content-grid"><div class="main-column"><section class="panel"><div class="panel-heading"><h2>Прогноз денег на 30 дней</h2><span class="badge demo">Демо</span></div>${cashChart()}</section>${table(['Дата','Контрагент','Назначение','Сумма'],data.transactions.filter(t=>inPeriod(t.date)).map(t=>[dateText(t.date),t.party,t.purpose,`<span class="${t.amount>0?'green':'red'}">${t.amount>0?'+':''}${money(t.amount)}</span>`]),'Демонстрационная банковская выписка')}</div><aside class="right-column"><section class="panel"><div class="panel-heading"><h2>Мои счета</h2></div><div class="panel-body stack">${data.accounts.map(a=>`<div><div class="row"><span class="source-logo ${a.name.startsWith('Т-Б')?'bank':'crm'}">${a.name.startsWith('Т-Б')?'T':'Т'}</span><strong style="font-size:12px;font-weight:500">${a.name}</strong></div><div style="font-size:24px;margin:12px 0 4px">${money(a.balance)}</div><p class="small muted">${a.account}</p></div>`).join('')}</div></section><section class="panel"><div class="panel-heading"><h2>Ближайшие платежи</h2></div><div class="panel-body">${data.payments.map(p=>`<div class="list-row"><div>${p.name}<small class="muted" style="display:block">${dateText(p.due)}</small></div><span>${money(p.amount,true)}</span></div>`).join('')}</div><button class="bottom-link" data-route="taxes">Открыть календарь ${I('arrow')}</button></section></aside></div>${pageFooter()}`}
function salesPage(){const t=totals();return `${titleBlock('Продажи','Как покупают вашу продукцию на каждом канале.',periodControl())}${demoBanner()}${metricStrip([['Заказов',num(t.orders),periodLabel()],['Выручка',money(t.revenue),'демо · все каналы'],['Средний чек',money(t.orders?t.revenue/t.orders:0),'выручка / количество заказов']])}<section class="panel"><div class="panel-heading"><h2>Продажи по каналам</h2></div>${channelsTable()}<div class="horizontal-bars">${periodChannels().map(c=>`<div><div class="bar-label"><span>${c.name}</span><span class="muted">${num(Math.round(c.orders))} заказов</span></div><div class="bar-track"><span style="width:${ratioPercent(c.revenue,totals().revenue)}%"></span></div></div>`).join('')}</div></section><h2 style="margin:28px 0 16px">Товары с наибольшей выручкой</h2>${productsTable()}${pageFooter()}`}

const integrations=[{id:'wb',name:'Wildberries',logo:'WB',cls:'wb',description:'Продажи, заказы, остатки и отчёты. Основа вашей аналитики.',guide:'Создайте токен в кабинете продавца: Профиль → Настройки → Доступ к API. Выберите категории статистики и аналитики с правами только на чтение.',vars:['WB_TOKEN'],url:'https://dev.wildberries.ru/'},{id:'ozon',name:'Ozon Seller',logo:'ozon',cls:'ozon',description:'Выручка, комиссии, логистика и остатки на складах.',guide:'Ozon Seller → Настройки → API-ключи. Создайте ключ с правами Admin read only. Сохраните Client-Id и Api-Key только на сервере.',vars:['OZON_CLIENT_ID','OZON_API_KEY'],url:'https://docs.ozon.ru/api/seller/'},{id:'performance',name:'Ozon Performance',logo:'AD',cls:'ozon',description:'Расходы, заказы и эффективность рекламных кампаний.',guide:'В отдельном кабинете Ozon Performance откройте Настройки → API. Эти ключи отличаются от Seller API.',vars:['OZON_PERF_CLIENT_ID','OZON_PERF_CLIENT_SECRET'],url:'https://docs.ozon.ru/api/performance/'},{id:'bank',name:'Банк',logo:'Т',cls:'bank',description:'Счета, выписки и реальная картина движения денег.',guide:'В Т-Банк Бизнес или Точке создайте API-токен с доступом только к чтению счетов и выписок. Коннектор сервера будет добавлен отдельным этапом.',vars:['TBANK_TOKEN','TOCHKA_TOKEN'],url:'https://developer.tbank.ru/'},{id:'mail',name:'Почта',logo:'@',cls:'crm',description:'Счета и акты из вложений — прямо в ваши документы.',guide:'Включите IMAP и создайте пароль приложения в настройках почты. Не используйте основной пароль. Не вводите пароль в этот демо-интерфейс.',vars:['IMAP_HOST','IMAP_USER','IMAP_PASSWORD'],url:'https://support.google.com/mail/answer/7126229'},{id:'telegram',name:'Telegram',logo:'TG',cls:'crm',description:'Отправляйте боту документы и фотографии со смартфона.',guide:'Создайте бота у @BotFather командой /newbot. Сохраните токен на сервере. В текущей версии обращения к Telegram не выполняются.',vars:['TELEGRAM_BOT_TOKEN'],url:'https://core.telegram.org/bots/api'},{id:'diadoc',name:'Диадок',logo:'Д',cls:'wb',description:'Входящие УПД, акты и документы, которые ждут подписи.',guide:'Получите ключ разработчика Контур и настройте доступ к организации. Подписание документов всегда выполняйте через ЭДО после проверки.',vars:['DIADOC_API_KEY','DIADOC_LOGIN','DIADOC_PASSWORD'],url:'https://developer.kontur.ru/'},{id:'ai',name:'OpenAI',logo:'AI',cls:'crm',description:'Распознавание документов и ответы по данным вашего бизнеса.',guide:'Для следующего этапа: подключение OpenAI API на сервере. Текущий ассистент отвечает по правилам на демо-данных; внешняя модель не вызывается.',vars:['OPENAI_API_KEY'],url:'https://platform.openai.com/docs/'}];
function integrationsPage(){return `${titleBlock('Интеграции','Соберите бизнес в одном пространстве. Подключайте по одному источнику.')}<div class="page-banner">${I('lock')}<span>Это демо-интерфейс. Ключи здесь не запрашиваются и не хранятся. Для реальных подключений нужен сервер с коннекторами — следующий этап сборки.</span></div><div class="integration-grid">${integrations.filter(s=>s.id!=='crm').map(s=>`<section class="panel integration-card"><div class="between"><span class="integration-logo ${s.cls}">${s.logo}</span><span class="badge demo">Не подключено</span></div><h2>${s.name}</h2><p>${s.description}</p><button data-integration="${s.id}">${I('plug')} Как подключить ${I('arrow')}</button></section>`).join('')}</div>${pageFooter()}`}
function render(){buildDecisions();document.getElementById('sidebar').innerHTML=navMarkup();document.getElementById('breadcrumbTitle').textContent=routes.find(r=>r[0]===route)?.[1]||'Главная';document.title='BrandOS — '+document.getElementById('breadcrumbTitle').textContent;const pages={home,pnl:pnlPage,dds:ddsPage,rnp:rnpPage,unit:unitPage,decisions:decisionsPage,analytics:analyticsPage,finance:financePage,sales:salesPage,marketplaces:marketplacesPage,ads:adsPage,stock:stockPage,supplies:suppliesPage,taxes:taxesPage,documents:documentsPage,integrations:integrationsPage,tasks:tasksPage};document.getElementById('main').innerHTML=(pages[route]||home)();document.getElementById('main').classList.remove('page-enter');void document.getElementById('main').offsetWidth;document.getElementById('main').classList.add('page-enter');if(data.lastUpdated&&document.getElementById('syncLabel'))document.getElementById('syncLabel').textContent='Демо обновлено · '+data.lastUpdated}
function navigate(next,focus=true){if(document.getElementById('drawer').classList.contains('open'))closeDrawer();if(!routes.some(r=>r[0]===next))next='home';route=next;if(location.hash!=='#'+next)history.replaceState(null,'','#'+next);closeMobileMenu();closeSearch();render();window.scrollTo({top:0,behavior:'instant'});if(focus)document.getElementById('main').focus({preventScroll:true})}
function closeSearch(){if(document.getElementById('searchResults').contains(document.activeElement))document.getElementById('globalSearch').focus();document.getElementById('searchResults').hidden=true;document.getElementById('globalSearch').setAttribute('aria-expanded','false')}
function closeMobileMenu(){if(document.getElementById('sidebar').classList.contains('mobile-open')&&document.getElementById('sidebar').contains(document.activeElement))document.getElementById('menuToggle').focus();document.getElementById('sidebar').classList.remove('mobile-open');document.getElementById('navScrim').hidden=true;document.getElementById('menuToggle').setAttribute('aria-expanded','false');if(!document.getElementById('drawer').classList.contains('open'))document.body.style.overflow=''}
function openDrawer(title,body,chat=false){if(document.getElementById('editor').open)document.getElementById('editor').close();drawerReturnFocus=document.activeElement;closeMobileMenu();const d=document.getElementById('drawer');d.innerHTML=`<div class="drawer-header"><div class="row">${chat?`<span class="ai-mark">${I('spark')}</span>`:''}<div><h2 id="drawerTitle">${esc(title)}</h2>${chat?'<p>Помощник по вашему бизнесу · демо</p>':''}</div></div><button class="icon-btn" data-action="close-drawer" aria-label="Закрыть панель">${I('close')}</button></div>${body}`;d.inert=false;d.classList.add('open');document.getElementById('drawerScrim').hidden=false;document.querySelector('.app').inert=true;document.getElementById('sidebar').inert=true;document.body.style.overflow='hidden';setTimeout(()=>d.querySelector('button,textarea,a,input')?.focus(),40)}
function closeDrawer(){const d=document.getElementById('drawer');d.classList.remove('open');d.inert=true;document.getElementById('drawerScrim').hidden=true;document.querySelector('.app').inert=false;document.getElementById('sidebar').inert=false;document.body.style.overflow='';if(drawerReturnFocus?.isConnected)drawerReturnFocus.focus();else document.getElementById('main').focus({preventScroll:true})}
function openChat(question=''){const t=totals();openDrawer('Бизнес-ассистент',`<div class="chat-messages" id="chatMessages" aria-live="polite" aria-relevant="additions"><div class="chat-message"><strong>Ваш бизнес — в фокусе</strong>Привет, ${esc(data.user.name)}! Помогу разобраться в показателях и выбрать следующий шаг.\n\nВыручка — ${money(t.revenue)}, на счетах — ${money(t.balance)}. Есть ${data.decisions.filter(d=>d.status==='new').length} решений, которые стоит посмотреть.\n\nЭто демо-ассистент на встроенных правилах. Внешний ИИ не подключён.</div></div><div class="chat-suggestions"><button data-chat-prompt="Что с деньгами?">Что с деньгами?</button><button data-chat-prompt="Какие товары заканчиваются?">Что дозаказать?</button><button data-chat-prompt="Что важно сегодня?">Что важно сегодня?</button></div><form class="chat-form" id="chatForm"><div class="row"><label class="visually-hidden" for="chatInput">Сообщение ассистенту</label><textarea id="chatInput" rows="2" maxlength="2000" placeholder="Спросите о своём бизнесе…" required></textarea><button class="primary icon-btn" aria-label="Отправить сообщение">${I('send')}</button></div><p>Ответы основаны на демо-данных. Не отправляйте ключи и пароли.</p></form>`,true);if(question)sendChat(question)}
function assistantReply(q){const text=q.toLowerCase(),t=totals();if(/ден|касс|финанс|плат|разрыв/.test(text)){const gap=data.cash.findIndex(v=>v<0);return `Деньги на счетах: ${money(t.balance)}.\nБлижайшие платежи: ${money(data.payments.reduce((s,p)=>s+p.amount,0))}.\n\n${dateText(day(gap))} прогнозируется кассовый разрыв до ${money(Math.min(...data.cash))}. Это сценарий на демо-данных, а не банковский прогноз.\n\nЧто сделать: согласовать перенос платежа поставщику, проверить очередность обязательных платежей и платёжный календарь.`}if(/товар|склад|заказ|остат|худи|свитшот/.test(text))return `Ниже 14 дней остатка:\n${data.products.filter(p=>stockDays(p)<14).map(p=>`• ${p.name} (${p.article}): ${p.stock} шт., примерно ${stockDays(p)} дней.`).join('\n')}\n\nДни остатка рассчитаны по средним продажам за 28 дней. В центре решений можно принять рекомендацию — шаги станут задачами.`;if(/реклам|дrr|дрр|кампан/.test(text))return data.campaigns.filter(c=>c.spend/c.revenue*100>data.settings.maxDrr).map(c=>`${c.name}: ДРР ${ratioPercent(c.spend,c.revenue).toFixed(1)}% при пороге ${data.settings.maxDrr}%.\nРасход: ${money(c.spend)}, заказов: ${c.orders}.\n\nПроверьте поисковые запросы и снизьте ставки по дорогим фразам. Сравните заказы и ДРР через 3 дня.`).join('\n\n')||'В демо-данных нет кампаний выше заданного порога ДРР.';if(/документ|упд|подпис/.test(text))return `Ждут проверки: ${data.documents.filter(d=>d.status!=='Обработан').length} документа.\n${data.documents.filter(d=>d.status!=='Обработан').map(d=>`• ${d.name}: ${d.status.toLowerCase()}.`).join('\n')}\n\nЯ вижу только метаданные. Содержимое файлов не анализируется без подключения ИИ. Подписание выполняется в ЭДО.`;if(/продаж|выруч|прибыл|марж/.test(text))return `За выбранный период:\n• Выручка: ${money(t.revenue)}.\n• Прибыль до налога: ${money(t.profit)}.\n• Маржа: ${t.margin.toFixed(1)}%.\n• Заказов: ${num(t.orders)}.\n\nВсе цифры демонстрационные. Себестоимость — ${data.settings.costPercent}% выручки, постоянные расходы — ${money(data.settings.fixedCosts)} в месяц. Их можно изменить в настройках.`;if(/сегодня|важн|задач|решен/.test(text))return `На сегодня:\n${data.tasks.filter(t=>t.status!==2&&t.due<=today).map(t=>`• ${t.title} — ${t.owner}${t.due<today?' (просрочено)':''}.`).join('\n')||'Срочных задач нет.'}\n\nНовых решений: ${data.decisions.filter(d=>d.status==='new').length}. Начните с товаров с низким остатком и рекламы выше порога ДРР.`;return 'У меня есть демонстрационные данные о продажах, деньгах, складе, рекламе, документах и задачах. Спросите, например, «Что с деньгами?» или «Какие товары заканчиваются?».\n\nНа другие вопросы без подключённой модели ИИ достоверно ответить не могу.'}
function sendChat(question){const text=question.trim();if(!text)return;const box=document.getElementById('chatMessages');if(!box)return;const u=document.createElement('div');u.className='chat-message user';u.textContent=text;box.append(u);const reply=document.createElement('div');reply.className='chat-message';const label=document.createElement('strong');label.textContent='Бизнес-ассистент · демо';reply.append(label,document.createTextNode(assistantReply(text)));box.append(reply);box.scrollTop=box.scrollHeight;document.getElementById('chatInput').value=''}

function integrationDetail(id){const s=integrations.find(s=>s.id===id&&s.id!=='crm');if(!s)return;openDrawer(s.name,`<div class="drawer-content"><span class="integration-logo ${s.cls}">${s.logo}</span><h3>Как подключить</h3><p>${esc(s.guide)}</p><h3>Параметры сервера</h3><div class="info-box">${s.vars.map(v=>`<code>${v}</code>`).join('<br>')}</div><p style="margin-top:16px">Не отправляйте ключи в чат и не сохраняйте их в браузере. Коннекторы и безопасная серверная конфигурация добавляются следующим этапом.</p><a href="${s.url}" target="_blank" rel="noopener noreferrer" class="secondary" style="display:inline-flex;align-items:center;gap:8px;padding:12px 16px;border-radius:8px;margin-top:24px;color:#c5b8ff">Официальная документация ${I('arrowUp')}</a></div>`)}
function field(label,name,type,value='',attrs=''){return `<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${attrs} aria-describedby="err-${name}"><span class="field-error" id="err-${name}"></span></div>`}
function selectField(label,name,options,value){return `<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${options.map((o,i)=>{const val=Array.isArray(o)?o[0]:o,label=Array.isArray(o)?o[1]:o;return `<option value="${esc(val)}" ${String(value)===String(val)?'selected':''}>${esc(label)}</option>`}).join('')}</select></div>`}
function showEditor(title,fields,handler,submitLabel='Сохранить'){if(document.getElementById('drawer').classList.contains('open'))closeDrawer();else closeMobileMenu();const dialog=document.getElementById('editor');dialog.innerHTML=`<div class="dialog-header"><h2 id="editorTitle">${esc(title)}</h2><button class="icon-btn" type="button" data-action="close-editor" aria-label="Закрыть окно">${I('close')}</button></div><form id="editorForm" novalidate><div class="form-body">${fields}</div><div class="dialog-footer"><button type="button" class="secondary" data-action="close-editor">Отмена</button><button class="primary" type="submit">${submitLabel}</button></div></form>`;dialog.showModal();const form=document.getElementById('editorForm');form.addEventListener('focusout',e=>{if(e.target.matches('input'))validateField(e.target)});form.addEventListener('input',e=>{if(e.target.matches('input')){e.target.removeAttribute('aria-invalid');const error=document.getElementById('err-'+e.target.name);if(error)error.textContent=''}});form.addEventListener('submit',e=>{e.preventDefault();let valid=true;for(const input of form.querySelectorAll('input'))if(!validateField(input))valid=false;if(!valid){form.querySelector('[aria-invalid=true]')?.focus();return}const values=Object.fromEntries(new FormData(form));handler(values);dialog.close();save();render()});}
function validateField(input){const error=document.getElementById('err-'+input.name);let message='';if(input.required&&!input.value.trim())message='Заполните это поле.';else if(input.type==='date'&&input.value&&!/^\d{4}-\d{2}-\d{2}$/.test(input.value))message='Укажите корректную дату.';else if(input.validity.customError)message=input.validationMessage;else if(!input.validity.valid)message=input.validity.rangeUnderflow?`Значение должно быть не меньше ${input.min}.`:input.validity.rangeOverflow?`Значение должно быть не больше ${input.max}.`:'Проверьте введённое значение.';if(error)error.textContent=message;if(message)input.setAttribute('aria-invalid','true');else input.removeAttribute('aria-invalid');return !message}
function taskEditor(id=null,preset={}){const t=data.tasks.find(t=>t.id===id)||{title:'',priority:'medium',due:today,owner:data.user.name,status:0,...preset};showEditor(id?'Редактировать задачу':'Создать задачу',field('Название задачи','title','text',t.title,'required maxlength="160"')+`<div class="form-row">${selectField('Приоритет','priority',[['high','Высокий'],['medium','Средний'],['low','Низкий']],t.priority)}${field('Срок','due','date',t.due,'required')}</div>`+selectField('Исполнитель','owner',data.user.team,t.owner)+selectField('Статус','status',taskStages.map((n,i)=>[i,n]),t.status),v=>{const item={...t,title:v.title.trim(),priority:v.priority,due:v.due,owner:v.owner,status:Number(v.status)};if(id)Object.assign(data.tasks.find(t=>t.id===id),item);else data.tasks.unshift({...item,id:uid(),ai:false});toast(id?'Задача обновлена':'Задача создана')},id?'Сохранить изменения':'Создать задачу')}

let fileDbPromise;
function fileDb(){if(!fileDbPromise)fileDbPromise=new Promise((resolve,reject)=>{const req=indexedDB.open('brandos-files',1);req.onupgradeneeded=()=>req.result.createObjectStore('files');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)});return fileDbPromise}
async function storeFile(id,file){const db=await fileDb();return new Promise((resolve,reject)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').put(file,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)})}
async function readFile(id){const db=await fileDb();return new Promise((resolve,reject)=>{const req=db.transaction('files').objectStore('files').get(id);req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
async function uploadFiles(files){let count=0;for(const file of files){if(file.size>10*1024*1024){toast(`${file.name}: размер превышает 10 МБ`);continue}if(!/\.(pdf|png|jpe?g|webp|csv|xlsx|docx|txt)$/i.test(file.name)){toast(`${file.name}: формат не поддерживается`);continue}const id=uid();try{await storeFile(id,file)}catch{toast('Не удалось сохранить файл в браузере. Проверьте доступное место.');continue}data.documents.unshift({id,name:file.name,source:'Загрузка',status:'Новый',type:'Не определён',amount:0,date:today,party:'Не определён',extension:file.name.split('.').pop().toUpperCase(),fileStored:true});count++}if(count){save();docSource='all';docStatus='all';navigate('documents');toast(`Загружено документов: ${count}. ИИ-распознавание не подключено.`)}document.getElementById('uploadInput').value=''}

function defaultTaxTemplate(){return `РАСЧЁТНЫЙ ЧЕРНОВИК ДЕКЛАРАЦИИ УСН\nНе является официальным бланком ФНС. Перед подачей перенесите данные в актуальную форму и проверьте их с бухгалтером.\n\nНалогоплательщик: {{company}}\nИНН: {{inn}}\nКПП: {{kpp}}\nОКТМО: {{oktmo}}\nНалоговый период: {{year}} год\nОбъект налогообложения: {{system}}\n\nДоходы за год: {{income}}\nРасходы за год: {{expenses}}\nСтавка: {{rate}}%\nИсчисленный налог: {{tax}}\nАвансовые платежи: {{advance}}\nК доплате: {{due}}\nК уменьшению: {{overpaid}}\n\nСформировано в BrandOS: {{date}}\nИсточник: значения, введённые пользователем; при демо-заполнении — вымышленные данные.\nВычеты и региональные особенности в этом рабочем шаблоне не учитываются.`}
function taxTemplatePageSection(){const v=data.taxForm;return `<section class="panel tax-builder" aria-labelledby="taxBuilderTitle"><div class="panel-heading"><div><h2 id="taxBuilderTitle">Декларация по шаблону</h2><p class="muted small" style="margin-top:4px">Заполните реквизиты и годовые суммы, затем сформируйте файл.</p></div><span class="badge warning">Черновик</span></div><div class="panel-body"><div class="info-box">Встроен рабочий текстовый шаблон УСН, без официального формата ФНС. Можно загрузить свой шаблон TXT. Тип декларации и официальный бланк требуют уточнения; этот файл предназначен для проверки бухгалтером.</div><form id="taxDeclarationForm" class="tax-form" novalidate>${field('Налогоплательщик / организация','company','text',v.company,'required maxlength="160"')}<div class="form-row">${field('ИНН (10 или 12 цифр)','inn','text',v.inn,'required inputmode="numeric" pattern="(?:[0-9]{10}|[0-9]{12})" maxlength="12"')}${field('ОКТМО (8 или 11 цифр)','oktmo','text',v.oktmo,'required inputmode="numeric" pattern="(?:[0-9]{8}|[0-9]{11})" maxlength="11"')}</div><div class="form-row">${field('КПП (для организации)','kpp','text',v.kpp,'inputmode="numeric" pattern="[0-9]{9}" maxlength="9"')}${field('Налоговый год','year','number',v.year,`required min="2000" max="${Number(today.slice(0,4))}" step="1"`)}</div><div class="form-row">${selectField('Объект налогообложения','system',[['income','УСН «Доходы»'],['profit','УСН «Доходы минус расходы»']],v.system)}${field('Ставка налога, %','rate','number',v.rate,'required min="0" max="100" step="0.01"')}</div><div class="form-row">${field('Доходы за полный год, ₽','income','number',v.income,'required min="0" max="1000000000000" step="0.01"')}${field('Признанные расходы за год, ₽','expenses','number',v.expenses,'required min="0" max="1000000000000" step="0.01"')}</div>${field('Уплаченные авансовые платежи, ₽','advance','number',v.advance,'required min="0" max="1000000000000" step="0.01"')}<div class="field"><label for="taxTemplate">Текст шаблона</label><textarea id="taxTemplate" name="template" rows="9" maxlength="30000" required>${esc(v.template)}</textarea><p class="muted small template-help">Поля: {{company}}, {{inn}}, {{kpp}}, {{oktmo}}, {{year}}, {{system}}, {{income}}, {{expenses}}, {{rate}}, {{tax}}, {{advance}}, {{due}}, {{overpaid}}, {{date}}.</p></div><div class="tax-buttons"><button type="button" class="secondary" data-action="load-tax-template">${I('upload')} Загрузить шаблон TXT</button><button type="button" class="secondary" data-action="demo-tax">Заполнить демо-пример</button><button class="primary" type="submit">${I('file')} Сформировать декларацию</button></div><p class="muted small">Суммы вводятся за весь налоговый год. Выбранный календарь отчётов их не заменяет. Для объекта «Доходы минус расходы» в примере применяется минимум 1% доходов; вычеты, льготы, убытки прошлых лет и изменения ставок не моделируются.</p></form></div></section>`}
function declarationValues(v){const income=Number(v.income),expenses=Number(v.expenses),rate=Number(v.rate),advance=Number(v.advance),base=v.system==='profit'?Math.max(0,income-expenses):income,calculated=Math.round(base*rate/100),tax=v.system==='profit'?Math.max(calculated,Math.round(income*.01)):calculated;return{company:v.company.trim(),inn:v.inn.trim(),kpp:v.kpp.trim()||'—',oktmo:v.oktmo.trim(),year:v.year,system:v.system==='profit'?'УСН «Доходы минус расходы»':'УСН «Доходы»',income:money(income),expenses:money(expenses),rate:v.rate,tax:money(tax),advance:money(advance),due:money(Math.max(0,tax-advance)),overpaid:money(Math.max(0,advance-tax)),date:dateText(today,true),taxAmount:tax}}
function generateDeclaration(form){let valid=true;for(const input of form.querySelectorAll('input'))if(!validateField(input))valid=false;const template=form.elements.template;if(!template.value.trim()){toast('Добавьте текст шаблона.');template.focus();return}if(!valid){form.querySelector('[aria-invalid=true]')?.focus();return}const v=Object.fromEntries(new FormData(form)),values=declarationValues(v),unknown=[...v.template.matchAll(/\{\{\s*([^{}]+?)\s*\}\}/g)].map(m=>m[1]).filter(k=>!(k in values)||k==='taxAmount');if(unknown.length){toast('Неизвестные поля шаблона: '+[...new Set(unknown)].join(', '));template.focus();return}data.taxForm={...data.taxForm,...v};save();declarationPreview={text:'ЧЕРНОВИК — НЕ ДЛЯ ПОДАЧИ В ФНС\n\n'+v.template.replace(/\{\{\s*([^{}]+?)\s*\}\}/g,(_,key)=>values[key]),name:`УСН-черновик-${v.year}-${v.inn}.txt`,tax:values.taxAmount,year:v.year};openDrawer('Предпросмотр декларации',`<div class="drawer-content"><span class="badge warning">Расчётный черновик</span><p style="margin-top:16px">Проверьте реквизиты, годовые суммы, выбранный объект и ставку. Скачивание не отправляет документ в налоговую.</p><pre class="declaration-preview">${esc(declarationPreview.text)}</pre><button class="primary" data-action="download-declaration">${I('download')} Скачать черновик TXT</button><p style="margin-top:16px">Файл также появится в разделе «Документы». Для официальной декларации нужен актуальный бланк и полный состав показателей.</p></div>`)}
async function downloadDeclaration(){if(!declarationPreview)return;const p=declarationPreview,file=new File([p.text],p.name,{type:'text/plain;charset=utf-8'}),id=uid();try{await storeFile(id,file);data.documents.unshift({id,name:p.name,source:'Загрузка',status:'Новый',type:'Черновик декларации',amount:p.tax,date:today,party:data.taxForm.company,extension:'TXT',fileStored:true});save();downloadBlob(file,p.name);toast('Черновик скачан и добавлен в документы')}catch{downloadBlob(file,p.name);toast('Черновик скачан; сохранить копию в браузере не удалось.')}}
async function readTaxTemplate(file){if(!file)return;if(file.size>100000||!file.name.toLowerCase().endsWith('.txt')){toast('Выберите шаблон TXT размером до 100 КБ.');return}const text=await file.text();if(text.length>30000||!text.trim()){toast('Шаблон должен содержать от 1 до 30 000 символов.');return}data.taxForm.template=text;save();render();toast('Шаблон загружен. Данные будут подставлены вместо полей {{…}}.')}
function exportReport(type){if(type==='pnl')return exportCSV('pnl',['Статья','Сумма, ₽','С','По'],pnlRows().map(([n,v])=>[n,v,reportRange.from,reportRange.to]));if(type==='dds'){const d=ddsMetrics();return exportCSV('dds',['Дата','Контрагент / статья','Сумма, ₽'],[[reportRange.from,'Остаток на начало',d.opening],...d.tx.map(t=>[t.date,t.party+' / '+t.purpose,t.amount]),[reportRange.to,'Остаток на конец',d.closing]])}if(type==='rnp')return exportCSV('rnp',['Дата','План','Выручка','Выполнение, %','Отклонение','Заказы','Реклама','Прибыль до налога'],dailyPerformance().map(r=>[r.date,r.plan,r.revenue,r.completion,r.deviation,r.orders,r.advertising,r.profit]));if(type==='unit')return exportSellerWorkbook();return false}

const sellerColumns=[

 {letter:'D',key:'buyout',label:'% Выкупа',input:'percent',min:.01},
 {letter:'E',key:'adRate',label:'Реклама %',input:'percent'},
 {letter:'F',key:'advertising',label:'Реклама, руб',formula:'C × E'},
 {letter:'G',key:'delivery',label:'Доставка ВБ, руб',input:'money'},
 {letter:'H',key:'deliveryAdjusted',label:'Доставка с % выкупа',formula:'G / D'},
 {letter:'I',key:'reverseLogistics',label:'Обратная логистика',formula:'Тариф возврата / D − тариф возврата'},
 {letter:'J',key:'taxRate',label:'Налог %',input:'percent'},
 {letter:'K',key:'tax',label:'Налог, руб',formula:'C × J'},

 {letter:'O',key:'lossRate',label:'Брак и потери %',input:'percent'},

 {letter:'R',key:'margin',label:'Маржа %',formula:'Q / C',percent:true},
 {letter:'S',key:'roi',label:'ROI %',formula:'Q / (B + N)',percent:true}
];
function initialSellerMoon(){return{version:1,returnTariff:50,rows:[{id:'seller-moon-1',name:'Товар 1',purchase:300,price:1550,buyout:55,adRate:10,delivery:56,taxRate:6,commissionRate:25,fulfillment:0,lossRate:5}]}}
function initSellerMoon(){const saved=data.sellerMoon;if(!saved||saved.version!==1||!Array.isArray(saved.rows))data.sellerMoon=initialSellerMoon()}
function sellerRowValid(row){return typeof row.name==='string'&&!!row.name.trim()&&sellerColumns.filter(c=>c.input&&c.input!=='text').every(c=>Number.isFinite(row[c.key])&&row[c.key]>=(c.min??0)&&row[c.key]<=(c.input==='percent'?100:1000000000))}
function calculateSellerRow(row,returnTariff=data.sellerMoon.returnTariff){if(!sellerRowValid(row))return{...row,valid:false};const advertising=row.price*row.adRate/100,deliveryAdjusted=row.delivery/(row.buyout/100),reverseLogistics=returnTariff/(row.buyout/100)-returnTariff,tax=row.price*row.taxRate/100,commission=row.price*row.commissionRate/100,loss=row.purchase*row.lossRate/100,profit=row.price-deliveryAdjusted-tax-commission-loss-row.purchase-reverseLogistics-row.fulfillment-advertising;return{...row,valid:true,advertising,deliveryAdjusted,reverseLogistics,tax,commission,loss,profit,margin:profit/row.price,roi:row.purchase+row.fulfillment>0?profit/(row.purchase+row.fulfillment):null}}
function unitRows(){return data.sellerMoon.rows.map(row=>calculateSellerRow(row))}
function sellerNumber(value){return Number.isFinite(value)?new Intl.NumberFormat('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2}).format(value):'—'}
function sellerCellValue(row,col){if(!row.valid)return'—';if(col.percent)return Number.isFinite(row[col.key])?sellerNumber(row[col.key]*100)+'%':'—';return sellerNumber(row[col.key])+' ₽'}
function sellerSummary(invalidIds=new Set()){const all=unitRows(),valid=all.filter(r=>r.valid&&!invalidIds.has(r.id)),average=key=>{const rows=valid.filter(r=>Number.isFinite(r[key]));return rows.length?rows.reduce((s,r)=>s+r[key],0)/rows.length:null},profit=average('profit'),margin=average('margin'),roi=average('roi');return metricStrip([[all.length>1?'Средняя прибыль с единицы':'Прибыль с 1 единицы',profit===null?'—':`<span class="${profit>=0?'green':'red'}">${sellerNumber(profit)} ₽</span>`,all.length>1?'среднее по заполненным товарам, без объёмов продаж':'расчёт по вашей таблице'],[all.length>1?'Средняя маржа':'Маржа',margin===null?'—':sellerNumber(margin*100)+'%','прибыль / цена без СПП'],[all.length>1?'Средний ROI':'ROI',roi===null?'—':sellerNumber(roi*100)+'%','прибыль / (закупка + ФФ)']])}
function sellerInput(row,col){const label=esc(col.label+' — '+row.name),id='sheet-'+row.id+'-'+col.key;return `<div class="sheet-field"><label class="visually-hidden" for="${id}">${label}</label><input id="${id}" data-seller-row="${esc(row.id)}" data-seller-field="${col.key}" aria-label="${label}" aria-describedby="${id}-error" type="${col.input==='text'?'text':'number'}" value="${esc(row[col.key]??'')}" ${col.input==='text'?'maxlength="160"':`min="${col.min??0}" max="${col.input==='percent'?100:1000000000}" step="any" inputmode="decimal"`} required><span class="sheet-error" id="${id}-error"></span>${col.input==='percent'?'<span class="sheet-percent" aria-hidden="true">%</span>':''}</div>`}

// Stable internal snapshot contract. Real marketplace IDs must come from source catalogs.
function validateInventorySnapshot(payload) {
  const fail = () => { throw new Error('Некорректный снимок остатков'); };
  if (!payload || payload.version !== 1 || !['demo', 'live'].includes(payload.mode) || !Array.isArray(payload.warehouses) || !Array.isArray(payload.items) || !Number.isFinite(Date.parse(payload.updatedAt)) || payload.warehouses.length > 1000 || payload.items.length > 100000) fail();
  const keys = new Map(), identities = new Set();
  for (const w of payload.warehouses) {
    if (!w || typeof w.key !== 'string' || !w.key || keys.has(w.key) || !['wb','ozon'].includes(w.marketplace) || typeof w.name !== 'string' || !w.name.trim() || !['FBW','FBO','FBS'].includes(w.fulfillment) || (w.externalId !== null && (typeof w.externalId !== 'string' || !w.externalId))) fail();
    if (payload.mode === 'live' && !w.externalId) fail();
    if (w.externalId) { const identity = `${w.marketplace}:${w.fulfillment}:${w.externalId}`; if (identities.has(identity)) fail(); identities.add(identity); }
    keys.set(w.key, w);
  }
  const records = new Set();
  for (const r of payload.items) {
    const w = keys.get(r?.warehouseKey);
    if (!w || r.marketplace !== w.marketplace || typeof r.article !== 'string' || !r.article.trim() || typeof r.name !== 'string' || !r.name.trim()) fail();
    for (const field of ['available','reserved','toCustomer','returnsInTransit']) if (!Number.isSafeInteger(r[field]) || r[field] < 0) fail();
    const key = JSON.stringify([r.warehouseKey,r.article]); if (records.has(key)) fail(); records.add(key);
  }
  // Allow only explicitly public inventory fields; discard unrelated source metadata.
  return {version:1,mode:payload.mode,updatedAt:payload.updatedAt,note:typeof payload.note === 'string' ? payload.note.slice(0,2000) : '',warehouses:payload.warehouses.map(w=>({key:w.key,marketplace:w.marketplace,externalId:w.externalId,name:w.name,fulfillment:w.fulfillment})),items:payload.items.map(r=>({warehouseKey:r.warehouseKey,marketplace:r.marketplace,article:r.article,name:r.name,available:r.available,reserved:r.reserved,toCustomer:r.toCustomer,returnsInTransit:r.returnsInTransit}))};
}
